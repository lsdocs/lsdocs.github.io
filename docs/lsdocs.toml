# The lsdocs documentation, built with lsdocs: `nur docs` writes it to
# docs/site. A test (crates/cli/tests/docs_site.rs) checks it builds
# without warnings, so broken links fail the tests. Each plugin's
# settings are in .config/lsdocs/<name>/settings.toml.

[site]
title = "lsdocs"

[build]
source_dir = "content"

[[plugins]]
name = "markdown"
builtin = "parser-markdown"

[[plugins]]
name = "rst"
builtin = "parser-rst"

[[plugins]]
name = "sphinx"
builtin = "sphinx-addons"

[[plugins]]
name = "extras"
builtin = "extras"

# The Python packages' API, from their source (Phase 12c).
[[plugins]]
name = "python"
builtin = "apidoc-python"

[[plugins]]
name = "typescript"
builtin = "apidoc-typescript"

# The Rust plugin SDK and the crates it re-exports, from rustdoc's JSON
# (a nightly toolchain: the plugin's default).
[[plugins]]
name = "rust"
builtin = "apidoc-rust"

# A sample C and C++ library (examples/clang-sample), with libclang.
[[plugins]]
name = "c"
builtin = "apidoc-c"

[[plugins]]
name = "cpp"
builtin = "apidoc-cpp"

[[plugins]]
name = "toc"
builtin = "transform-toc"

[[plugins]]
name = "links"
builtin = "transform-links"

[[plugins]]
name = "nav"
builtin = "transform-nav"

[[plugins]]
name = "highlight"
builtin = "transform-highlight"

[[plugins]]
name = "html"
builtin = "render-html"
