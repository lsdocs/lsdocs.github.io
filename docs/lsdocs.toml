# The lsdocs documentation, built with lsdocs: `nur docs` writes it to
# docs/site; `nur ci` checks it builds without warnings, so broken links
# fail. Each plugin's settings are in .config/lsdocs/<name>/settings.toml.
# The API reference is built by the repositories it documents.

[site]
title = "lsdocs"

[build]
source_dir = "content"

[[plugins]]
name = "markdown"
builtin = "parser-markdown"

[[plugins]]
name = "rst"
builtin = "parser-rst"

[[plugins]]
name = "sphinx"
builtin = "sphinx-addons"

[[plugins]]
name = "extras"
builtin = "extras"

[[plugins]]
name = "toc"
builtin = "transform-toc"

[[plugins]]
name = "links"
builtin = "transform-links"

[[plugins]]
name = "nav"
builtin = "transform-nav"

[[plugins]]
name = "highlight"
builtin = "transform-highlight"

[[plugins]]
name = "html"
builtin = "render-html"
