# The lsdocs documentation, built with lsdocs: `nur docs` writes it to
# docs/site. A test (crates/cli/tests/docs_site.rs) checks it builds
# without warnings, so broken links fail the tests.

[site]
title = "lsdocs"

[build]
source_dir = "content"

[[plugins]]
name = "markdown"
builtin = "parser-markdown"

[[plugins]]
name = "rst"
builtin = "parser-rst"

[[plugins]]
name = "sphinx"
builtin = "sphinx-addons"

# The Python packages' API, from their source (Phase 12c).
[[plugins]]
name = "python"
builtin = "apidoc-python"
options = { paths = ["../bindings/plugin/python/python/lsdocs_plugin", "../bindings/rst/python/python/lsdocs_rst"], primary = true, output = "api/python" }

[[plugins]]
name = "typescript"
builtin = "apidoc-typescript"
options = { paths = [{ path = "../bindings/plugin/node/index.d.ts", module = "@lsdocs/plugin" }, { path = "../bindings/rst/node/index.d.ts", module = "@lsdocs/rst" }], output = "api/typescript" }

# The Rust plugin SDK and the crates it re-exports, from rustdoc's JSON
# (a nightly toolchain: the plugin's default). Its own target directory,
# so it neither waits for nor disturbs other cargo builds.
[[plugins]]
name = "rust"
builtin = "apidoc-rust"
options = { crates = ["../crates/plugin-sdk", "../crates/protocol", "../crates/doctree"], output = "api/rust", target_dir = "../target/lsdocs-rustdoc" }

[[plugins]]
name = "toc"
builtin = "transform-toc"

[[plugins]]
name = "links"
builtin = "transform-links"

[[plugins]]
name = "nav"
builtin = "transform-nav"

[[plugins]]
name = "highlight"
builtin = "transform-highlight"

[[plugins]]
name = "html"
builtin = "render-html"
